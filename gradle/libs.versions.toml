[versions]
agp = "8.5.2"
kotlin = "2.0.20"
camerax = "1.4.2"
hilt = "2.51.1"
datastore = "1.1.1"
compose-bom = "2024.09.00"
core-ktx = "1.13.1"
activity-compose = "1.9.2"
lifecycle = "2.8.3"
hilt-navigation-compose = "1.2.0"
exifinterface = "1.3.7"
filterlibrary = "2.0.0"
zxing = "3.5.4"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[libraries]
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
# Filter Lab: grading oracle reference + stamp/palette work. Apache-2.0, see
# THIRD_PARTY_NOTICES.md. JitPack coordinate is the UPSTREAM owner, not our fork.
filterlibrary = { module = "com.github.hgayan7:FilterLibrary", version.ref = "filterlibrary" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
